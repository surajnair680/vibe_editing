<!doctype html>
<html><head><meta charset="utf-8"><title>Vox explainer test</title>
<!-- Test reel for the vox-explainer house kit (2026-11-24). 1080x1920, 14 s, drawn from the time alone.
     Motion is stepped on twos: every pose is held for 1/12 s (2 frames at 24 fps). Render with
     node tools/seek_render.mjs .claude/skills/vox-explainer/example/index.html --size 1080x1920 --fps 24 --dur 14 ... -->
<style>
@font-face{font-family:Anton;src:url(fonts/Anton-400.ttf)}
@font-face{font-family:Inter;src:url(fonts/Inter-600.ttf);font-weight:600}
@font-face{font-family:Mono;src:url(fonts/JetBrainsMono-700.ttf);font-weight:700}
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, DUR = 14;
const C = { red: '#B8312A', cream: '#F1E6D0', paper: '#FBF7EE', navy: '#14213D', yellow: '#F2C230', ink: '#1B1B1B' };
const cv = document.getElementById('c'), x = cv.getContext('2d');

// ---------- helpers ----------
function rng(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = p => 1 - Math.pow(1 - clamp(p), 3);          // ease-out cubic, no overshoot (no bouncing)
const easeIO = p => { p = clamp(p); return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
const span = (t, a, b) => clamp((t - a) / (b - a));
const twos = t => Math.floor(t * 12 + 1e-6) / 12;          // hold each pose for 2 frames at 24 fps
const step = t => Math.floor(t * 12 + 1e-6);               // which drawing we are on (for boil and grain)

// A torn-paper rectangle: jagged outline, cached per seed so the edge is the same paper every frame.
const tornCache = {};
function tornPath(w, h, seed, rough = 9) {
  const k = [w, h, seed, rough].join();
  if (tornCache[k]) return tornCache[k];
  const r = rng(seed), pts = [];
  const edge = (x0, y0, x1, y1, nx, ny) => {
    const len = Math.hypot(x1 - x0, y1 - y0), n = Math.max(4, Math.round(len / 14));
    for (let i = 0; i < n; i++) {
      const f = i / n, j = (r() - .5) * rough + (r() < .12 ? (r() - .5) * rough * 1.6 : 0);
      pts.push([x0 + (x1 - x0) * f + nx * j, y0 + (y1 - y0) * f + ny * j]);
    }
  };
  edge(0, 0, w, 0, 0, 1); edge(w, 0, w, h, -1, 0); edge(w, h, 0, h, 0, -1); edge(0, h, 0, 0, 1, 0);
  return tornCache[k] = pts;
}
function tracePts(pts, dx = 0, dy = 0, grow = 0, cx = 0, cy = 0) {
  x.beginPath();
  pts.forEach(([px, py], i) => {
    const gx = px + (px - cx) * grow, gy = py + (py - cy) * grow;
    i ? x.lineTo(gx + dx, gy + dy) : x.moveTo(gx + dx, gy + dy);
  });
  x.closePath();
}
// Draw a torn sheet centred on (cx, cy): white fibre fringe, shadow, colour, optional halftone.
function sheet(cx, cy, w, h, color, seed, rot = 0, opt = {}) {
  const pts = tornPath(w, h, seed, opt.rough || 9);
  x.save(); x.translate(cx, cy); x.rotate(rot); x.translate(-w / 2, -h / 2);
  if (!opt.flat) { x.shadowColor = 'rgba(20,20,30,.35)'; x.shadowBlur = 18; x.shadowOffsetX = 6; x.shadowOffsetY = 10; }
  x.fillStyle = opt.fringe || '#FFFDF6';                     // the fibre edge, a little bigger than the colour
  tracePts(tornPath(w + 10, h + 10, seed + 7, (opt.rough || 9) * 1.2), -5, -5); x.fill();
  x.shadowColor = 'transparent';
  x.fillStyle = color; tracePts(pts); x.fill();
  if (opt.halftone) { x.save(); tracePts(pts); x.clip(); x.globalAlpha = opt.halftone; x.fillStyle = dotPattern; x.fillRect(0, 0, w, h); x.restore(); }
  if (opt.draw) { x.save(); tracePts(pts); x.clip(); opt.draw(w, h); x.restore(); }
  x.restore();
}
function text(s, px, py, size, color, font = 'Anton', align = 'center', base = 'middle', track = 0) {
  x.font = `${font === 'Inter' ? '600 ' : font === 'Mono' ? '700 ' : ''}${size}px ${font}`;
  x.fillStyle = color; x.textAlign = align; x.textBaseline = base;
  if ('letterSpacing' in x) x.letterSpacing = track + 'px';
  x.fillText(s, px, py);
  if ('letterSpacing' in x) x.letterSpacing = '0px';
}
function textW(s, size, font = 'Anton') { x.font = `${size}px ${font}`; return x.measureText(s).width; }

// Halftone dots and grain (built once, then reused: fast).
let dotPattern, grain = [];
function buildTextures() {
  const d = document.createElement('canvas'); d.width = d.height = 16; const g = d.getContext('2d');
  g.fillStyle = '#000'; g.beginPath(); g.arc(8, 8, 3.2, 0, 7); g.fill();
  dotPattern = x.createPattern(d, 'repeat');
  for (let k = 0; k < 6; k++) {
    const n = document.createElement('canvas'); n.width = 540; n.height = 960; const ng = n.getContext('2d');
    const im = ng.createImageData(540, 960), r = rng(99 + k * 31);
    for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
    ng.putImageData(im, 0, 0); grain.push(n);
  }
}
const img = {};
function loadImg(k, src) { return new Promise(r => { const i = new Image(); i.onload = () => { img[k] = i; r(); }; i.onerror = r; i.src = src; }); }

// ---------- finish (over everything) ----------
function finish(t) {
  const s = step(t);
  x.save();
  x.globalCompositeOperation = 'overlay'; x.globalAlpha = .16;    // paper and film grain, changes on twos
  x.drawImage(grain[s % 6], 0, 0, W, H);
  x.globalCompositeOperation = 'multiply'; x.globalAlpha = .9;     // soft vignette
  const v = x.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .75);
  v.addColorStop(0, 'rgba(255,255,255,1)'); v.addColorStop(1, 'rgba(150,135,120,1)');
  x.fillStyle = v; x.fillRect(0, 0, W, H);
  x.globalCompositeOperation = 'screen'; x.globalAlpha = .10;      // colour fringing at the edges only
  let gl = x.createLinearGradient(0, 0, 60, 0); gl.addColorStop(0, '#ff3040'); gl.addColorStop(1, '#000');
  x.fillStyle = gl; x.fillRect(0, 0, 60, H);
  gl = x.createLinearGradient(W, 0, W - 60, 0); gl.addColorStop(0, '#30c0ff'); gl.addColorStop(1, '#000');
  x.fillStyle = gl; x.fillRect(W - 60, 0, 60, H);
  x.restore();
}

// ---------- shots ----------
// Safe zone for Reels: words between y 250 and 1420, nothing in the right 120 px.
function paperGround() { x.fillStyle = C.paper; x.fillRect(0, 0, W, H); }

// 1 (0 to 3.4 s) the question, big, on torn strips
function shot1(t) {
  paperGround();
  sheet(W / 2, 900, 1300, 1250, C.navy, 11, -.03, { halftone: .10, flat: true });
  const lines = [['WHY ARE THE', C.red, C.cream, 128], ['BEST PHYSIQUES', C.red, C.cream, 128], ['BUILT BY', C.cream, C.navy, 110], ['ABNORMAL', C.yellow, C.navy, 190], ['PEOPLE?', C.red, C.cream, 160]];
  let y = 560;
  lines.forEach(([s, bg, fg, size], i) => {
    const a = i ? .1 + i * .32 : -.2, p = ease(span(twos(t), a, a + .42));  // line 1 is already landing on frame 0
    if (p <= 0) { y += size * 1.12 + 26; return; }
    const w = textW(s, size) + 80, h = size * 1.12;
    const off = (1 - p) * (i % 2 ? 1 : -1) * 900, rot = (i % 2 ? .02 : -.025) * (1 + (1 - p) * 2);
    sheet(W / 2 - 40 + off, y + h / 2, w, h, bg, 30 + i, rot, {
      draw: (sw, sh) => text(s, sw / 2, sh / 2 + size * .04, size, fg)
    });
    y += h + 26;
  });
}

// 2 (3.4 to 7.0 s) a grid of identical tiles, then one breaks the pattern
function shot2(t) {
  paperGround();
  const tt = twos(t);
  text('MOST PEOPLE', W / 2 - 40, 400, 96, C.navy);
  const cols = 3, rows = 4, tw = 250, th = 190, gap = 28;
  const gx = (W - 120 - (cols * tw + (cols - 1) * gap)) / 2 + 60 - 40 + tw / 2, gy = 540 + th / 2;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const i = r * cols + c, a = 3.55 + i * .07, p = ease(span(tt, a, a + .3));
    if (p <= 0) continue;
    const odd = (r === 2 && c === 1), flip = odd ? span(tt, 5.3, 5.55) : 0;
    const cx = gx + c * (tw + gap), cy = gy + r * (th + gap) - (1 - p) * 120;
    const sx = odd && flip > 0 ? Math.abs(Math.cos(flip * Math.PI)) : 1;   // card flip on twos
    const red = odd && flip >= .5;
    x.save(); x.translate(cx, cy); x.scale(Math.max(sx, .04) * (red ? 1.08 : 1), red ? 1.08 : 1);
    sheet(0, 0, tw, th, red ? C.red : C.cream, 50 + i, ((i * 37) % 7 - 3) * .006, {
      draw: (w, h) => text(red ? 'YOU' : 'NORMAL', w / 2, h / 2 + 4, red ? 92 : 46, red ? C.cream : '#8A7F70', red ? 'Anton' : 'Mono', 'center', 'middle', red ? 0 : 2)
    });
    x.restore();
  }
  const p = ease(span(tt, 5.8, 6.15));
  if (p > 0) sheet(W / 2 - 40, 1440 + (1 - p) * 300, 860, 120, C.navy, 77, -.015, {
    draw: (w, h) => text('NORMAL EFFORT. NORMAL RESULTS.', w / 2, h / 2 + 3, 56, C.cream)
  });
}

// 3 (7.0 to 11.0 s) three photo cards drop in, a marker circle names them
function photoCard(cx, cy, w, h, im, name, seed, rot, p) {
  if (p <= 0) return;
  const lift = (1 - p) * -260, sc = 1 + (1 - p) * .25;
  x.save(); x.translate(cx, cy + lift); x.scale(sc, sc);
  sheet(0, 0, w, h, '#FFFDF6', seed, rot, {
    rough: 6, draw: (sw, sh) => {
      if (!im) return;
      const m = 16, iw = sw - m * 2, ih = sh - m * 2 - 70;          // photo unfiltered (house rule)
      const s = Math.max(iw / im.width, ih / im.height);
      x.save(); x.beginPath(); x.rect(m, m, iw, ih); x.clip();
      x.drawImage(im, m + (iw - im.width * s) / 2, m + (ih - im.height * s) / 2 * .4, im.width * s, im.height * s);
      x.restore();
      text(name, sw / 2, sh - 44, 34, C.ink, 'Mono', 'center', 'middle', 1);
    }
  });
  x.restore();
}
function shot3(t) {
  paperGround();
  const tt = twos(t);
  sheet(W / 2, 900, 1240, 860, C.cream, 91, .02, { halftone: .06, flat: true });
  text('THE ONES WE REMEMBER', W / 2 - 40, 400, 84, C.navy);
  const w = 290, h = 420, gap = 22, cx0 = W / 2 - 40 - (w + gap), cy = 900;
  photoCard(cx0, cy, w, h, img.jobs, 'JOBS', 101, -.03, ease(span(tt, 7.2, 7.6)));
  photoCard(cx0 + w + gap, cy, w, h, img.arnold, 'ARNOLD', 102, .02, ease(span(tt, 7.55, 7.95)));
  photoCard(cx0 + 2 * (w + gap), cy, w, h, img.musk, 'MUSK', 103, -.015, ease(span(tt, 7.9, 8.3)));
  // marker circle draws itself around all three, on twos, with a slight boil
  const p = span(tt, 8.7, 9.4);
  if (p > 0) {
    const b = rng(500 + step(t) % 3);
    x.save(); x.strokeStyle = C.red; x.lineWidth = 11; x.lineCap = 'round'; x.globalAlpha = .92;
    x.beginPath();
    const n = 80, end = Math.round(n * 1.08 * p);
    for (let i = 0; i <= end; i++) {
      const a = -Math.PI * .62 + i / n * Math.PI * 2, j = (b() - .5) * 3;
      const px = W / 2 - 40 + Math.cos(a) * (500 + j), py = cy + 10 + Math.sin(a) * (320 + j);
      i ? x.lineTo(px, py) : x.moveTo(px, py);
    }
    x.stroke(); x.restore();
  }
  const q = ease(span(tt, 9.5, 9.85));
  if (q > 0) sheet(W / 2 - 40, 1360 + (1 - q) * 260, 700, 150, C.red, 120, .02, {
    draw: (sw, sh) => text('ALL OUTLIERS', sw / 2, sh / 2 + 4, 104, C.cream)
  });
}

// 4 (11.0 to 14.0 s) the takeaway, five words or fewer, with a highlighter sweep
function shot4(t) {
  paperGround();
  const tt = twos(t);
  sheet(W / 2, 900, 1300, 900, C.red, 140, -.025, { halftone: .12, flat: true });
  const p1 = ease(span(tt, 11.15, 11.5)), p2 = ease(span(tt, 11.45, 11.85));
  if (p1 > 0) sheet(W / 2 - 40 - (1 - p1) * 900, 760, 520, 190, C.cream, 141, -.03, { draw: (w, h) => text('BE THE', w / 2, h / 2 + 6, 168, C.navy) });
  if (p2 > 0) {
    const sw = span(tt, 12.0, 12.5);                              // highlighter sweep behind the word
    sheet(W / 2 - 40 + (1 - p2) * 900, 1000, 860, 250, C.cream, 142, .02, {
      draw: (w, h) => {
        if (sw > 0) { x.fillStyle = C.yellow; x.globalAlpha = .95; x.fillRect(40, h * .2, (w - 80) * easeIO(sw), h * .62); x.globalAlpha = 1; }
        text('OUTLIER.', w / 2, h / 2 + 8, 220, C.navy);
      }
    });
  }
}

// paper wipe between shots: a big torn sheet crosses the frame on twos
function wipe(t, at, color, seed) {
  const p = span(twos(t), at - .25, at + .25);
  if (p <= 0 || p >= 1) return;
  const xPos = -W * .8 + easeIO(p) * W * 2.6;
  sheet(xPos, H / 2, W * 1.3, H * 1.2, color, seed, .06, { rough: 18 });
}

const SHOTS = [[0, 3.4, shot1], [3.4, 7.0, shot2], [7.0, 11.0, shot3], [11.0, 14.0, shot4]];
function draw(t) {
  t = clamp(t, 0, DUR - 1e-4);
  const s = SHOTS.find(([a, b]) => t >= a && t < b) || SHOTS[SHOTS.length - 1];
  x.setTransform(1, 0, 0, 1, 0, 0);
  s[2](t);
  wipe(t, 3.4, C.cream, 201); wipe(t, 7.0, C.navy, 202); wipe(t, 11.0, C.red, 203);
  finish(t);
}

window.ready = (async () => {
  await Promise.all([loadImg('jobs', 'assets/celebrity_jobs.jpg'), loadImg('arnold', 'assets/celebrity_arnold.jpg'), loadImg('musk', 'assets/celebrity_musk.jpg'),
    document.fonts.load('100px Anton'), document.fonts.load('600 40px Inter'), document.fonts.load('700 40px Mono')]);
  buildTextures();
})();
window.seek = async t => { await window.ready; draw(t); };
// Autoplay when opened normally; an exporter adds ?render and drives seek itself.
if (!location.search.includes('render')) window.ready.then(() => { const t0 = performance.now(); const loop = () => { draw(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); }; loop(); });
</script></body></html>
