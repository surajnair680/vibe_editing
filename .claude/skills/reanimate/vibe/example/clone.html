<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:D;src:url(file:///usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf)}
html,body{margin:0;width:540px;height:960px;background:#121216;overflow:hidden;font-family:D}
.card{position:absolute;left:60px;top:560px;width:421px;height:171px;border-radius:28px;background:#ffd600;
 opacity:0;animation:up 467ms cubic-bezier(.34,1.56,.64,1) 300ms forwards}
@keyframes up{0%{opacity:1;transform:translateY(220px)}100%{opacity:1;transform:none}}
.w{position:absolute;top:61px;white-space:nowrap;font-size:54px;line-height:1;color:#ffd600;opacity:0;
 animation:pop 250ms cubic-bezier(.33,1,.68,1) both}
@keyframes pop{from{opacity:0;transform:translateY(30px);color:#ffd600}to{opacity:1;transform:none;color:#141414}}
</style></head><body><div class="card">
<span class="w" style="left:30px;animation-delay:600ms">3</span>
<span class="w" style="left:86px;animation-delay:700ms">GYM</span>
<span class="w" style="left:241px;animation-delay:800ms">MISTAKES</span>
</div></body></html>
