<script>
(() => {
"use strict";
const T = JSON.parse(document.getElementById("tl-data").textContent);
const FPS = T.fps || 30, FR = 1 / FPS;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const snap = (t) => Math.round(t * FPS) / FPS;
const tc = (t) => { const c = Math.round(Math.max(0, t) * 100), s = Math.floor(c / 100);   // m:ss.hh (hundredths, not frames)
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") + "." + String(c % 100).padStart(2, "0"); };
const sec = (t) => t.toFixed(2) + " s";
const labw = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--labw")) || 76;

/* ---------- state ---------- */
const S = { mode: "render", t: 0, playing: false, pps: 46, sel: null, edits: { cuts: {}, shifts: {} },
  status: "draft", notes: [], db: null, saveMsg: "", draftNote: null, confirmReset: false };
const baseSegs = T.segments.map((g) => ({ ...g }));
const segIndex = Object.fromEntries(baseSegs.map((g, i) => [g.id, i]));
const parts = T.sources.parts;
const partOf = (s) => parts.find((p) => s >= p.start - 1e-6 && s < p.end + 1e-6) || parts[0];
const peaks = T.peaks ? Uint8Array.from(atob(T.peaks.data), (c) => c.charCodeAt(0)) : null;

function build(useEdits) {
  let t = 0; const out = [];
  baseSegs.forEach((g, i) => {
    const o = useEdits ? S.edits.cuts[g.id] : null;
    if (o && o.deleted) return;
    const a = o && o.src_in != null ? o.src_in : g.src_in, b = o && o.src_out != null ? o.src_out : g.src_out;
    const sp = g.speed || 1, len = Math.round((b - a) / sp * FPS) / FPS;
    out.push({ ...g, n: i + 1, src_in: a, src_out: b, speed: sp, edit_in: t, len, mod: !!o });
    t += len;
  });
  return out;
}
let SEG = build(false), LEN = 0;
const recompute = () => { SEG = build(S.mode === "live"); LEN = SEG.length ? SEG[SEG.length - 1].edit_in + SEG[SEG.length - 1].len : 0; };
const nEdits = () => Object.keys(S.edits.cuts).length + Object.keys(S.edits.shifts).length;
function segAt(t, segs = SEG) { let lo = 0, hi = segs.length - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (segs[m].edit_in <= t + 1e-9) lo = m; else hi = m - 1; } return lo; }
function editToSrc(t, segs = SEG) { const g = segs[segAt(t, segs)]; return g ? g.src_in + (t - g.edit_in) * g.speed : 0; }
function srcToEdit(s, segs = SEG) {   // null when that moment of the take is cut out
  for (const g of segs) if (s >= g.src_in - 1e-6 && s <= g.src_out + 1e-6) return g.edit_in + (s - g.src_in) / g.speed;
  return null; }
function srcToEditNear(s, segs = SEG) { const e = srcToEdit(s, segs); if (e != null) return e;
  const g = segs.find((x) => x.src_in >= s); return g ? g.edit_in : LEN; }

/* ---------- media ---------- */
const vr = $("vr"), va = $("va"), vb = $("vb");
const hasPreview = !!(T.media && T.media.preview), hasProxy = !!(T.media && T.media.proxy);
if (hasPreview) vr.src = T.media.preview;
if (hasProxy) { va.src = T.media.proxy; vb.src = T.media.proxy; }
const E = { k: 0, act: va, nxt: vb, unlocked: false };
function show(v) { [vr, va, vb].forEach((x) => x.classList.toggle("on", x === v)); }
function noMedia(msg) { const n = $("nomedia"); n.hidden = !msg; n.textContent = msg || ""; }
function syncMedia() {
  if (S.mode === "render") {
    if (!hasPreview) { noMedia("No render uploaded for this version yet."); show(null); return; }
    noMedia(""); show(vr); try { vr.currentTime = Math.min(S.t, LEN); } catch (e) {}
  } else {
    if (!hasProxy) { noMedia("Live cut needs the low-res copy of the raw takes. Ask Claude to add it."); show(null); return; }
    noMedia(""); liveLoad(S.t);
  }
}
function liveLoad(t) {
  if (!SEG.length) return; E.k = segAt(t); const g = SEG[E.k];
  E.act.playbackRate = g.speed; try { E.act.currentTime = g.src_in + (t - g.edit_in) * g.speed; } catch (e) {}
  show(E.act); prepNext();
}
function prepNext() { const g = SEG[E.k + 1]; if (!g) return; E.nxt.playbackRate = g.speed; try { E.nxt.currentTime = g.src_in; } catch (e) {} }
function contiguous(a, b) { return b && Math.abs(b.src_in - a.src_out) < FR * 0.6 && b.speed === a.speed; }

async function play() {
  if (S.mode === "render" ? !hasPreview : !hasProxy) return;
  if (S.t >= LEN - FR) { S.t = 0; syncMedia(); }
  S.playing = true; $("play").textContent = "Pause";
  try {
    if (S.mode === "render") await vr.play();
    else {
      if (!E.unlocked) { E.unlocked = true; E.nxt.muted = true; E.nxt.play().then(() => { E.nxt.pause(); E.nxt.muted = false; prepNext(); }).catch(() => { E.nxt.muted = false; }); }
      await E.act.play();
    }
  } catch (e) { pause(); }
}
function pause() { S.playing = false; $("play").textContent = "Play"; [vr, va, vb].forEach((v) => { try { v.pause(); } catch (e) {} }); }
vr.addEventListener("ended", () => { pause(); });

function tick() {
  if (S.playing) {
    if (S.mode === "render") { S.t = vr.currentTime; if (S.t >= LEN) pause(); }
    else {
      let g = SEG[E.k];
      if (g && E.act.currentTime >= g.src_out - 0.012) {
        const nx = SEG[E.k + 1];
        if (!nx) { S.t = LEN; pause(); }
        else if (contiguous(g, nx)) { E.k++; prepNext(); }
        else { E.k++; const old = E.act; E.act = E.nxt; E.nxt = old; E.act.play().catch(() => {}); old.pause(); show(E.act); prepNext(); }
        g = SEG[E.k];
      }
      if (S.playing && g) S.t = g.edit_in + (E.act.currentTime - g.src_in) / g.speed;
    }
    follow();
  }
  drawHead();
  requestAnimationFrame(tick);
}

/* ---------- timeline ---------- */
const sc = $("scroller"), inner = $("inner");
const TRACKS = (() => {
  const extra = T.tracks || [];
  const def = [{ id: "gfx", label: "Graphics" }, { id: "sfx", label: "SFX" }, { id: "music", label: "Music" }];
  const tr = [{ id: "ruler", label: "", h: 24 }, { id: "cuts", label: "Cuts", h: 48 }, { id: "voice", label: "Voice", h: 40 }, { id: "words", label: "Words", h: 26 }];
  const seen = new Set();
